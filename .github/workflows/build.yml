name: Build debug APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: RedPlayer-debug, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RedPlayer-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RedPlayer-debug.apk --title "Red Player (debug)" --notes "APK debug gerado automaticamente."
